name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Assemble static site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site/charts _site/rankings/2026-07-24 _site/data/2026-07-24
          cp -R site/. _site/
          cp -R charts/en _site/charts/en
          cp -R charts/zh-CN _site/charts/zh-CN
          cp rankings/2026-07-24/*.csv _site/rankings/2026-07-24/
          cp data/2026-07-24/*.csv _site/data/2026-07-24/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
